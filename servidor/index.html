<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Cristal WA Pro - Ultra UI</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(-45deg, #050b14, #101f2c, #0a1724, #1a2c38);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.2);
      --accent-color: #00f2fe;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-gradient); background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #e9edef; overflow: hidden; height: 100vh;
    }

    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    #app-container { display: flex; width: 100%; height: 100%; }

    #sidebar {
      width: 320px; background: rgba(0, 0, 0, 0.45); border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column; backdrop-filter: blur(25px) saturate(200%);
      z-index: 5; transition: left 0.3s ease;
    }

    .sidebar-header {
      padding: 18px; border-bottom: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5);
    }
    .sidebar-category {
      font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      color: var(--accent-color); padding: 12px 18px; background: rgba(0,0,0,0.3);
      border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05);
      margin-top: 5px;
    }

    .chat-item {
      padding: 14px 18px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex; align-items: center; gap: 12px; border-left: 4px solid transparent;
    }
    .chat-item:hover { background: rgba(255,255,255,0.05); transform: translateX(5px); }
    .chat-item.activo { background: rgba(255, 255, 255, 0.08); border-left: 4px solid var(--accent-color); box-shadow: inset 20px 0 30px -20px var(--accent-color); }
    
    #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }

    @media (max-width: 768px) {
      #sidebar { position: absolute; height: 100%; left: -320px; }
      #sidebar.open { left: 0; }
      .btn-toggle-sidebar { display: inline-block !important; }
    }

    header {
      background: rgba(25, 30, 40, 0.4); backdrop-filter: blur(30px); border-bottom: 1px solid var(--glass-border);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    header h2 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap:12px; font-weight:600;}
    .badge-sala { font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 12px; border: 1px solid var(--accent-color); color: var(--accent-color); text-shadow: 0 0 10px var(--accent-color); }
    .btn-toggle-sidebar { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

    /* Modales Mejorados */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-contenido {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(40px); border: 1px solid var(--glass-border);
      padding: 28px; border-radius: 24px; width: 90%; max-width: 400px;
      display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-input, .modal-select { padding: 12px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.4); color: #fff; outline: none; transition: 0.3s; font-size: 0.9rem;}
    .modal-input:focus { border-color: var(--accent-color); box-shadow: 0 0 15px rgba(0,242,254,0.3); }
    .btn-principal { background: var(--accent-color); border: none; color: #000; padding: 12px; border-radius: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
    .btn-principal:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-color); }
    .btn-secundario { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border); padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .btn-secundario:hover { background: rgba(255,255,255,0.1); }

    /* Mensajes */
    #contendor-mensajes { flex: 1; overflow-y: auto; padding: 25px 20px; position: relative; scroll-behavior: smooth; }
    #mensajes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
    .mensaje {
      max-width: 78%; padding: 14px 18px; font-size: 0.95rem; word-wrap: break-word;
      backdrop-filter: blur(15px); border: 1px solid var(--glass-border); position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .mensaje-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;}
    .usuario-info { display: flex; align-items: center; gap: 8px; }
    .avatar-mini { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color); }
    .usuario-nombre { font-size: 0.8rem; font-weight: 700; color: #fff;}
    .usuario-id { font-size: 0.65rem; color: var(--accent-color); opacity: 0.8;}
    .btn-borrar { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 0.9rem; transition: 0.2s;}
    .btn-borrar:hover { color: #ff4d4d; }
    .mensaje.enviado { align-self: flex-end; border-radius: 22px 22px 4px 22px; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border-right: 3px solid var(--accent-color); }
    .mensaje.recibido { align-self: flex-start; border-radius: 22px 22px 22px 4px; background: rgba(0,0,0,0.4); border-left: 3px solid #666; }
    
    /* Entradas */
    #barra-entrada { background: rgba(0,0,0,0.6); backdrop-filter: blur(30px); padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--glass-border); }
    .btn-icono { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #aebac1; transition: 0.3s; }
    .btn-icono:hover { color: var(--accent-color); transform: scale(1.1); }
    #input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    #input:focus { background: rgba(255,255,255,0.1); border-color: var(--accent-color); }

    .tab-container { display: flex; gap: 8px; margin-bottom: 8px; }
    .tab-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; cursor: pointer; font-size: 0.85rem; text-align: center; transition: 0.3s;}
    .tab-btn.active { background: var(--accent-color); color: black; font-weight: bold; box-shadow: 0 0 15px var(--accent-color); border:none;}
  </style>
</head>
<body>

  <!-- MODAL AÑADIR POR IDENTIFICADOR -->
  <div id="modal-agregar-id" class="modal" style="display:none;">
    <div class="modal-contenido">
      <h3 style="margin:0; color:var(--accent-color);">Añadir Contacto / Grupo</h3>
      <p style="font-size:0.8rem; color:#aaa; margin:0;">Escribe el identificador único del usuario.</p>
      <input type="text" id="target-id-input" class="modal-input" placeholder="Ej: +52123456789 o ID_Usuario..." />
      <select id="accion-id-select" class="modal-select">
        <option value="dm">👤 Iniciar Mensaje Directo</option>
        <option value="grupo">👥 Añadir al Grupo Actual</option>
      </select>
      <button class="btn-principal" onclick="ejecutarAccionIdentificador()">Añadir</button>
      <button class="btn-secundario" onclick="document.getElementById('modal-agregar-id').style.display='none'">Cancelar</button>
    </div>
  </div>

  <!-- MODAL PERFIL -->
  <div id="modal-usuario" class="modal">
    <div class="modal-contenido">
      <h2 style="margin:0; text-align:center;">Acceso Cristal</h2>
      <div class="tab-container">
        <div id="tab-login" class="tab-btn active" onclick="seleccionarModo('login')">🔑 Entrar</div>
        <div id="tab-registro" class="tab-btn" onclick="seleccionarModo('registro')">✨ Registro</div>
        <div id="tab-invitado" class="tab-btn" onclick="seleccionarModo('invitado')">👤 Anónimo</div>
      </div>
      
      <input type="text" id="identificador-input" class="modal-input" placeholder="Tu Identificador (Ej. tu celular o ID)" />
      <input type="text" id="nombre-input" class="modal-input" placeholder="Tu Nombre para mostrar..." style="display:none;" />
      <input type="password" id="password-input" class="modal-input" placeholder="Contraseña secreta" />

      <div id="seccion-personalizacion" style="display:none;">
        <label style="font-size:0.8rem; color:#ccc;">Color de burbuja:</label>
        <input type="color" id="color-input" style="width:100%; height:40px; border:none; border-radius:10px; cursor:pointer;" value="#005c4b" />
        <label style="font-size:0.8rem; margin-top:10px; display:block; color:#ccc;">Foto de perfil:</label>
        <input type="file" id="foto-perfil-input" accept="image/*" class="modal-input" style="padding: 8px;"/>
      </div>

      <label style="font-size:0.8rem; color:#ccc; margin-top:10px;">Tema Visual:</label>
      <select id="tema-select" class="modal-select" onchange="cambiarTema(this.value)">
        <option value="azul">🔷 Neón Azul</option>
        <option value="rosa">💖 Neón Rosa</option>
        <option value="esmeralda">🟢 Esmeralda</option>
        <option value="morado">🌌 Morado Galaxia</option>
        <option value="fuego">🔥 Fuego Intenso</option>
        <option value="matrix">💻 Matrix Hacker</option>
        <option value="oro">👑 Oro Imperial</option>
        <option value="nieve">❄️ Nieve Ártica</option>
      </select>

      <button id="btn-entrar" class="btn-principal" style="margin-top:15px;" onclick="guardarPerfil()">Ingresar</button>
    </div>
  </div>

  <div id="app-container">
    
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="usuario-info">
          <img id="mi-avatar-sidebar" src="" class="avatar-mini" style="display:none;" />
          <div style="display:flex; flex-direction:column;">
            <span id="mi-nombre-sidebar" style="font-weight: bold;">Cargando...</span>
            <span id="mi-id-sidebar" class="usuario-id"></span>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-icono" onclick="document.getElementById('modal-agregar-id').style.display='flex'" title="Añadir por Identificador">➕</button>
          <button class="btn-icono" onclick="document.getElementById('modal-usuario').style.display='flex'" title="Perfil">⚙️</button>
        </div>
      </div>
      <div id="lista-chats" style="flex: 1; overflow-y: auto;">
        <!-- Rellenado dinámicamente -->
      </div>
    </div>

    <!-- MAIN CHAT -->
    <div id="main-chat">
      <header>
        <h2>
          <button class="btn-toggle-sidebar" onclick="toggleSidebar()">☰</button>
          <span id="badge-sala" class="badge-sala">🌐 Global</span>
        </h2>
      </header>
      <div id="contendor-mensajes"><ul id="mensajes"></ul></div>
      <div id="barra-entrada">
        <label class="btn-icono" title="Subir Imagen">📷 <input type="file" accept="image/*" style="display:none;" onchange="enviarArchivo(this, 'foto')" /></label>
        <input id="input" autocomplete="off" placeholder="Escribe tu mensaje..." onkeypress="if(event.key === 'Enter') enviarTexto()" />
        <button class="btn-principal" onclick="enviarTexto()">Enviar</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    let miPerfil = { nombre: 'Anónimo', identificador: '', color: '#005c4b', foto: '', esAdmin: false };
    let salaActual = 'global'; let misChats = []; let modoAcceso = 'login';

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    function seleccionarModo(modo) {
      modoAcceso = modo;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${modo}`).classList.add('active');
      
      document.getElementById('identificador-input').style.display = modo === 'invitado' ? 'none' : 'block';
      document.getElementById('nombre-input').style.display = modo === 'registro' || modo === 'invitado' ? 'block' : 'none';
      document.getElementById('password-input').style.display = modo === 'invitado' ? 'none' : 'block';
      document.getElementById('seccion-personalizacion').style.display = modo === 'registro' ? 'block' : 'none';
    }

    function cambiarTema(tema) {
      const docs = document.documentElement.style;
      const temas = {
        'azul': { bg: 'linear-gradient(-45deg, #050b14, #101f2c, #0a1724, #1a2c38)', acc: '#00f2fe' },
        'rosa': { bg: 'linear-gradient(-45deg, #1f0518, #2c102b, #240a23, #381a37)', acc: '#ff007f' },
        'esmeralda': { bg: 'linear-gradient(-45deg, #021a12, #082d21, #042419, #0d3d2e)', acc: '#00ff88' },
        'morado': { bg: 'linear-gradient(-45deg, #1a0533, #2b1055, #1d0a33, #3b1a5e)', acc: '#b24bf3' },
        'fuego': { bg: 'linear-gradient(-45deg, #2b0a05, #4a150a, #330b05, #5e1c0d)', acc: '#ff5e00' },
        'matrix': { bg: 'linear-gradient(-45deg, #021202, #042404, #021a02, #053305)', acc: '#00ff00' },
        'oro': { bg: 'linear-gradient(-45deg, #1f1b03, #332b05, #1a1502, #403606)', acc: '#ffce00' },
        'nieve': { bg: 'linear-gradient(-45deg, #101a24, #1a2a3a, #142230, #203548)', acc: '#ffffff' }
      };
      docs.setProperty('--bg-gradient', temas[tema].bg);
      docs.setProperty('--accent-color', temas[tema].acc);
    }

    // RENDERIZAR LA BARRA LATERAL CON SEPARADORES
    function renderizarSidebar() {
      const lista = document.getElementById('lista-chats');
      lista.innerHTML = '';
      if (!misChats.find(c => c.sala === 'global')) misChats.unshift({ sala: 'global', tipo: 'global', nombre_chat: '🌐 Servidor Global' });

      // Categoría Servidores y Grupos
      lista.innerHTML += `<div class="sidebar-category">🌐 Servidores y Grupos</div>`;
      misChats.filter(c => c.tipo !== 'dm').forEach(c => renderChat(c, lista));
      
      // Categoría Mensajes Directos
      const dms = misChats.filter(c => c.tipo === 'dm');
      if(dms.length > 0) {
          lista.innerHTML += `<div class="sidebar-category">👤 Mensajes Directos</div>`;
          dms.forEach(c => renderChat(c, lista));
      }
    }

    function renderChat(chat, contenedor) {
      const isActive = chat.sala === salaActual ? 'activo' : '';
      const icon = chat.tipo === 'dm' ? '👤' : (chat.tipo === 'global' ? '🌐' : '👥');
      const n = chat.tipo === 'global' ? '🌐 Servidor Global' : chat.nombre_chat;
      contenedor.innerHTML += `<div class="chat-item ${isActive}" onclick="abrirChat('${chat.sala}', '${n}', '${chat.tipo}')"><div style="font-size:1.3rem;">${icon}</div><div style="font-weight:600;">${n}</div></div>`;
    }

    function abrirChat(salaId, nombre, tipo) {
      salaActual = salaId; document.getElementById('badge-sala').innerText = `${tipo === 'dm' ? '👤' : '👥'} ${nombre}`;
      socket.emit('unirse_sala', { sala: salaId, perfil: miPerfil, nombreChat: nombre });
      renderizarSidebar(); if (window.innerWidth <= 768) toggleSidebar();
    }

    function guardarPerfil() {
      const identificador = document.getElementById('identificador-input').value.trim();
      const usuarioRaw = document.getElementById('nombre-input').value.trim();
      const password = document.getElementById('password-input').value;
      const color = document.getElementById('color-input').value;
      const fotoFile = document.getElementById('foto-perfil-input').files[0];

      const procesar = (fotoB64 = '') => {
        socket.emit('autenticar_usuario', { 
            usuario: usuarioRaw, password, identificador, color, foto: fotoB64, esRegistro: modoAcceso === 'registro' 
        }, (res) => {
          if (res.exito) {
              miPerfil = res.perfil; misChats = res.misChats;
              document.getElementById('mi-nombre-sidebar').innerText = miPerfil.nombre;
              document.getElementById('mi-id-sidebar').innerText = "ID: " + miPerfil.identificador;
              if(miPerfil.foto) { document.getElementById('mi-avatar-sidebar').src = miPerfil.foto; document.getElementById('mi-avatar-sidebar').style.display = 'block'; }
              document.getElementById('modal-usuario').style.display = 'none';
              abrirChat('global', '🌐 Servidor Global', 'global');
          } else alert(res.mensaje);
        });
      };

      if (fotoFile && modoAcceso === 'registro') {
        const r = new FileReader(); r.onload = (e) => procesar(e.target.result); r.readAsDataURL(fotoFile);
      } else procesar();
    }

    function ejecutarAccionIdentificador() {
      const idTarget = document.getElementById('target-id-input').value.trim();
      const accion = document.getElementById('accion-id-select').value;
      if(!idTarget) return alert("Escribe un identificador.");
      
      socket.emit('crear_o_anadir_por_id', { accion, identificadorTarget: idTarget, miIdentificador: miPerfil.identificador, miNombre: miPerfil.nombre, salaActual }, (res) => {
          if(res.exito) {
              if(accion === 'dm') { misChats.push(res.chat); abrirChat(res.chat.sala, res.chat.nombre_chat, 'dm'); }
              else alert(res.mensaje);
              document.getElementById('modal-agregar-id').style.display = 'none';
          } else alert(res.mensaje);
      });
    }

    socket.on('chat_creado', (c) => { if (!misChats.find(x => x.sala === c.sala)) { misChats.push(c); renderizarSidebar(); } });

    // MENSAJES CON VALIDACION DE IDENTIFICADOR PARA RENDERIZAR A LA DERECHA
    function enviarTexto() { 
        const t = document.getElementById('input').value.trim(); 
        if (t) { 
            socket.emit('chat_message', { tipo: 'texto', texto: t, identificador: miPerfil.identificador, nombre: miPerfil.nombre, color: miPerfil.color, foto: miPerfil.foto }); 
            document.getElementById('input').value = ''; 
        } 
    }
    function enviarArchivo(input, tipo) { 
        if (input.files && input.files[0]) { 
            const r = new FileReader(); 
            r.onload = (e) => socket.emit('chat_message', { tipo, contenido: e.target.result, identificador: miPerfil.identificador, nombre: miPerfil.nombre, color: miPerfil.color, foto: miPerfil.foto }); 
            r.readAsDataURL(input.files[0]); 
        } 
    }

    socket.on('cargar_historial', (ms) => { document.getElementById('mensajes').innerHTML = ''; ms.forEach(m => agregarMensajeAlDOM(m)); });
    socket.on('chat_message', (data) => agregarMensajeAlDOM(data));

    function agregarMensajeAlDOM(data) {
      const lista = document.getElementById('mensajes');
      if (data.tipo === 'sistema') { const sys = document.createElement('li'); sys.className = 'mensaje'; sys.style.alignSelf = 'center'; sys.style.background='transparent'; sys.style.color='var(--accent-color)'; sys.innerText = data.texto; lista.appendChild(sys); return; }

      let item = document.getElementById(data.msgId);
      
      // EL TRUCO DE ORO: Validar mediante identificador y nombre si el mensaje es tuyo.
      const esMio = (data.identificador === miPerfil.identificador && data.nombre === miPerfil.nombre);
      
      if (!item) { 
          item = document.createElement('li'); 
          item.className = `mensaje ${esMio ? 'enviado' : 'recibido'}`; 
          item.id = data.msgId; 
          lista.appendChild(item); 
      }

      const avatar = data.foto ? `<img src="${data.foto}" class="avatar-mini"/>` : '';
      const bBorrar = esMio ? `<button class="btn-borrar" onclick="socket.emit('eliminar_mensaje', {msgId:'${data.msgId}'})">🗑️</button>` : '';

      let content = data.tipo === 'texto' ? `<div>${data.texto}</div>` : (data.tipo === 'foto' ? `<img src="${data.contenido}" style="max-width:200px; border-radius:10px;"/>` : '');
      
      item.innerHTML = `<div class="mensaje-cabecera"><div class="usuario-info">${avatar}<div style="display:flex; flex-direction:column;"><span class="usuario-nombre" style="color:${data.color}">${data.nombre}</span><span class="usuario-id">${data.identificador || 'Sin ID'}</span></div></div>${bBorrar}</div>${content}`;
      
      document.getElementById('contendor-mensajes').scrollTop = document.getElementById('contendor-mensajes').scrollHeight;
    }
    
    socket.on('mensaje_eliminado', (data) => { const el = document.getElementById(data.msgId); if(el) el.remove(); });
  </script>
</body>
</html>
