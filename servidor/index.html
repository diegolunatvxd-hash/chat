<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Cristal WA Pro - DMs & Grupos</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(-45deg, #050b14, #101f2c, #0a1724, #1a2c38);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.2);
      --accent-color: #00f2fe;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #e9edef;
      overflow: hidden;
      height: 100vh;
    }

    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    /* LAYOUT WHATSAPP WEB */
    #app-container { display: flex; width: 100%; height: 100%; }

    #sidebar {
      width: 300px;
      background: rgba(0, 0, 0, 0.4);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
      backdrop-filter: blur(15px);
      z-index: 5;
      transition: left 0.3s ease;
    }

    .chat-item {
      padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; gap: 12px;
    }
    .chat-item:hover { background: rgba(255,255,255,0.05); }
    .chat-item.activo { background: rgba(0, 242, 254, 0.15); border-left: 4px solid var(--accent-color); }
    
    #main-chat {
      flex: 1; display: flex; flex-direction: column; position: relative;
    }

    @media (max-width: 768px) {
      #sidebar { position: absolute; height: 100%; left: -300px; }
      #sidebar.open { left: 0; }
      .btn-toggle-sidebar { display: inline-block !important; }
    }

    header {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    header h2 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap:10px;}
    .badge-sala { font-size: 0.75rem; background: rgba(0, 242, 254, 0.2); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--accent-color); }
    .btn-toggle-sidebar { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

    /* Modales */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-contenido {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
      padding: 22px; border-radius: 24px; width: 85%; max-width: 380px;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-input, .modal-select { padding: 10px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.25); color: #e9edef; outline: none; }
    .btn-principal { background: linear-gradient(135deg, rgba(0, 168, 132, 0.8) 0%, rgba(0, 200, 150, 0.6) 100%); border: 1px solid var(--glass-border); color: white; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-secundario { background: rgba(255,255,255,0.08); color: white; border: 1px solid var(--glass-border); padding: 8px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; text-align: center; }
    .btn-admin { background: rgba(220, 53, 69, 0.8); font-weight: bold; }

    /* Mensajes */
    #contendor-mensajes { flex: 1; overflow-y: auto; padding: 20px 16px; position: relative; }
    #mensajes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
    .mensaje {
      max-width: 75%; padding: 12px 16px; font-size: 0.95rem; word-wrap: break-word;
      backdrop-filter: blur(20px); border: 1px solid var(--glass-border); position: relative;
    }
    .mensaje-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .usuario-info { display: flex; align-items: center; gap: 6px; }
    .avatar-mini { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color); }
    .usuario-nombre { font-size: 0.75rem; font-weight: bold; }
    .btn-borrar { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 0.8rem; }
    .mensaje.enviado { align-self: flex-end; border-radius: 20px 20px 4px 20px; }
    .mensaje.recibido { align-self: flex-start; border-radius: 20px 20px 20px 4px; }
    .mensaje-sistema { align-self: center; background: rgba(0,0,0,0.5); border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 12px; padding: 8px 16px; font-size: 0.85rem; color: #ffd700; text-align: center; }

    /* Multimedia / UI Tools */
    .mensaje img.foto-preview { max-width: 250px; border-radius: 14px; cursor: pointer; display: block; border: 1px solid var(--glass-border); }
    .audio-cristal-box { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); border-radius: 18px; padding: 8px 12px; min-width: 220px; backdrop-filter: blur(15px); }
    .btn-audio-play { background: var(--accent-color); color: #000; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; }
    .audio-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .audio-progress { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; position: relative; }
    .audio-bar { width: 0%; height: 100%; background: var(--accent-color); border-radius: 5px; }
    .audio-tiempo { font-size: 0.65rem; color: #aebac1; display: flex; justify-content: space-between; }
    .btn-download-icon { background: none; border: none; color: white; cursor: pointer; font-size: 1.1rem; text-decoration: none; }

    /* Encuestas */
    .encuesta-box { background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px; min-width: 240px; }
    .encuesta-pregunta { font-weight: bold; font-size: 0.95rem; color: var(--accent-color); }
    .opcion-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 8px; padding: 8px; color: white; cursor: pointer; text-align: left; position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; }
    .opcion-progress { position: absolute; top: 0; left: 0; height: 100%; background: rgba(0,242,254,0.25); z-index: 0; transition: width 0.3s; }
    .opcion-texto, .opcion-votos { z-index: 1; font-size: 0.85rem; }
    .votantes-lista { font-size: 0.7rem; color: #aaa; margin-top: 2px; }

    /* Entradas */
    #barra-entrada { background: rgba(255,255,255,0.05); backdrop-filter: blur(25px); padding: 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--glass-border); }
    .btn-icono { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #aebac1; }
    .btn-icono.grabando { color: #ff4d4d; animation: pulsoGrabando 1s infinite; }
    @keyframes pulsoGrabando { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    #input { flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: #e9edef; outline: none; }

    /* Modales Extra */
    #modal-fullscreen-img { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
    #modal-fullscreen-img img { max-width: 90vw; max-height: 80vh; border-radius: 16px; }
    .btn-cerrar-fs { position: absolute; top: 20px; right: 25px; font-size: 2rem; color: white; cursor: pointer; }
    .btn-descargar-fs { margin-top: 15px; padding: 10px 20px; border-radius: 12px; background: var(--accent-color); color: #000; font-weight: bold; text-decoration: none; }

    /* WebRTC */
    #modal-llamada { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,20,30,0.95); backdrop-filter: blur(25px); border: 1px solid var(--accent-color); border-radius: 24px; padding: 16px; z-index: 1000; color: white; width: 90vw; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); text-align: center; }
    .video-call-box { position: relative; width: 100%; height: 380px; background: #000; border-radius: 18px; overflow: hidden; margin: 10px 0; border: 1px solid var(--glass-border); display: none; }
    .video-full { width: 100%; height: 100%; object-fit: cover; }
    .video-pip { position: absolute; bottom: 12px; right: 12px; width: 110px; height: 150px; object-fit: cover; border-radius: 12px; border: 2px solid var(--accent-color); cursor: pointer; z-index: 10; }
    .btn-call { padding: 10px 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    
    .tab-container { display: flex; gap: 6px; margin-bottom: 6px; }
    .tab-btn { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; cursor: pointer; font-size: 0.8rem; text-align: center; }
    .tab-btn.active { background: var(--accent-color); color: black; font-weight: bold; }
  </style>
</head>
<body>

  <audio id="audio-notificacion" src="alarm_A5GlMHT.mp3" preload="auto"></audio>

  <!-- MODAL LLAMADA & VIDEOLLAMADA INTERACTIVA -->
  <div id="modal-llamada">
    <div style="font-weight:bold; font-size:1.1rem;" id="titulo-llamada">📞 Llamada Entrante</div>
    <div style="font-size:0.85rem; color:#aaa;" id="subtitulo-llamada">Conectando...</div>
    <div id="contenedor-video-call" class="video-call-box">
      <video id="video-principal" class="video-full" autoplay playsinline></video>
      <video id="video-secundario" class="video-pip" autoplay playsinline muted title="Haz clic para cambiar vistas" onclick="intercambiarCamaras()"></video>
    </div>
    <div style="display:flex; justify-content:center; gap:10px; margin-top:8px;" id="acciones-llamada">
      <button class="btn-call" style="background:#00c896; color:white;" onclick="aceptarLlamada()">Aceptar</button>
      <button class="btn-call" style="background:#ff4d4d; color:white;" onclick="colgarLlamada()">Rechazar</button>
    </div>
  </div>

  <div id="modal-fullscreen-img">
    <span class="btn-cerrar-fs" onclick="cerrarImagenFS()">&times;</span>
    <img id="img-fullscreen-target" src="" />
    <a id="btn-download-fs" class="btn-descargar-fs" download="Imagen_Cristal.png">📥 Descargar Imagen</a>
  </div>

  <!-- MODAL ENCUESTA -->
  <div id="modal-encuesta" class="modal" style="display:none;">
    <div class="modal-contenido">
      <h3>📊 Crear Encuesta</h3>
      <input type="text" id="encuesta-pregunta-input" class="modal-input" placeholder="Pregunta..." />
      <input type="text" class="modal-input opcion-input" placeholder="Opción 1" />
      <input type="text" class="modal-input opcion-input" placeholder="Opción 2" />
      <input type="text" class="modal-input opcion-input" placeholder="Opción 3 (Opcional)" />
      <button class="btn-principal" onclick="publicarEncuesta()">Publicar Encuesta</button>
      <button class="btn-secundario" onclick="cerrarModalEncuesta()">Cancelar</button>
    </div>
  </div>

  <!-- MODAL PERFIL -->
  <div id="modal-usuario" class="modal">
    <div class="modal-contenido">
      <h3>Acceso al Chat</h3>
      <div class="tab-container">
        <div id="tab-invitado" class="tab-btn active" onclick="seleccionarModo('invitado')">👤 Invitado</div>
        <div id="tab-login" class="tab-btn" onclick="seleccionarModo('login')">🔑 Registrado</div>
        <div id="tab-registro" class="tab-btn" onclick="seleccionarModo('registro')">✨ Registrarse</div>
      </div>
      <input type="text" id="nombre-input" class="modal-input" placeholder="Nombre de Usuario..." />
      <input type="password" id="password-input" class="modal-input" placeholder="Contraseña (opcional para invitado)" style="display:none;" />

      <div id="seccion-personalizacion">
        <label style="font-size:0.8rem;">Color de burbuja:</label>
        <input type="color" id="color-input" style="width:100%; height:35px; border:none; cursor:pointer;" value="#005c4b" />
        <label style="font-size:0.8rem; margin-top:5px; display:block;">Foto de perfil:</label>
        <input type="file" id="foto-perfil-input" accept="image/*" class="modal-input" />
      </div>

      <select id="tipo-sala-select" class="modal-select" onchange="toggleCodigoPrivado()">
        <option value="global">🌐 Servidor Público Global</option>
        <option value="privado">👥 Unirse a Grupo Privado</option>
      </select>
      <input type="text" id="codigo-sala-input" class="modal-input" placeholder="Nombre/Código del Grupo (ej. Familia)" style="display:none;" />

      <label style="font-size:0.8rem;">Tema Cristal:</label>
      <select id="tema-select" class="modal-select" onchange="cambiarTema(this.value)">
        <option value="azul">🔷 Cristal Neón Azul</option>
        <option value="rosa">💖 Cristal Neón Rosa</option>
        <option value="esmeralda">🟢 Cristal Esmeralda</option>
      </select>

      <button id="btn-entrar" class="btn-principal" style="margin-top:10px;" onclick="guardarPerfil()">Guardar y Entrar</button>
    </div>
  </div>

  <!-- MODAL MIEMBROS -->
  <div id="modal-miembros" class="modal" style="display:none;">
    <div class="modal-contenido">
      <h3>Usuarios Conectados</h3>
      <div id="lista-usuarios-conectados" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button class="btn-secundario" onclick="cerrarModalMiembros()">Cerrar</button>
    </div>
  </div>

  <div id="app-container">
    
    <!-- SIDEBAR WHATSAPP STYLE -->
    <div id="sidebar">
      <div style="padding: 15px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5);">
        <div class="usuario-info">
          <img id="mi-avatar-sidebar" src="" class="avatar-mini" style="display:none;" />
          <span id="mi-nombre-sidebar" style="font-weight: bold;">Cargando...</span>
        </div>
        <button class="btn-icono" style="font-size: 1.5rem;" onclick="abrirModalPerfil()" title="Mi Perfil">👤</button>
      </div>
      <div style="padding: 10px; font-size: 0.85rem; color: var(--accent-color); font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1);">MIS CHATS</div>
      <div id="lista-chats" style="flex: 1; overflow-y: auto;">
        <!-- Chats insertados vía JS -->
      </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div id="main-chat">
      <header>
        <h2>
          <button class="btn-toggle-sidebar" onclick="toggleSidebar()">☰</button>
          <span>Chat Cristal</span>
          <span id="badge-sala" class="badge-sala">🌐 Global</span>
        </h2>
        <div style="display:flex; align-items:center;">
          <button id="btn-admin-bloqueo" class="btn-secundario btn-admin" style="display:none;" onclick="toggleBloqueoAdmin()">🔒 Bloquear</button>
          <button class="btn-icono" title="Crear Encuesta" onclick="abrirModalEncuesta()">📊</button>
          <button class="btn-icono" title="Llamar / Miembros" onclick="abrirModalMiembros()">📞</button>
        </div>
      </header>

      <div id="contendor-mensajes">
        <ul id="mensajes"></ul>
      </div>

      <div id="barra-entrada">
        <label class="btn-icono" title="Subir Imagen">📷 <input type="file" id="input-foto" accept="image/*" style="display:none;" onchange="enviarArchivo(this, 'foto')" /></label>
        <label class="btn-icono" title="Subir Audio">🎵 <input type="file" id="input-audio-file" accept="audio/*" style="display:none;" onchange="enviarArchivo(this, 'audio')" /></label>
        <button id="btn-mic" class="btn-icono" title="Grabar Audio" onclick="alternarGrabacion()">🎙️</button>
        <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
        <button id="btn-enviar" class="btn-principal" onclick="enviarTexto()">Enviar</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    let miPerfil = { nombre: 'Anónimo', color: '#005c4b', foto: '', esAdmin: false };
    let salaActual = 'global';
    let misChats = [];
    let chatBloqueado = false, modoAcceso = 'invitado', grabando = false;
    let mediaRecorder, audioChunks = [];
    let localStream = null, remoteStream = null, peerConnection = null, idLlamadaEntrante = null, esVideoLlamada = false, miCamaraEnGrande = false;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    function seleccionarModo(modo) {
      modoAcceso = modo;
      document.getElementById('tab-invitado').classList.toggle('active', modo === 'invitado');
      document.getElementById('tab-login').classList.toggle('active', modo === 'login');
      document.getElementById('tab-registro').classList.toggle('active', modo === 'registro');
      document.getElementById('nombre-input').style.display = modo === 'login' ? 'none' : 'block';
      document.getElementById('password-input').style.display = modo === 'invitado' ? 'none' : 'block';
      document.getElementById('seccion-personalizacion').style.display = modo === 'login' ? 'none' : 'block';
    }

    function cambiarTema(tema) {
      if (tema === 'rosa') { document.documentElement.style.setProperty('--bg-gradient', 'linear-gradient(-45deg, #1f0518, #2c102b, #240a23, #381a37)'); document.documentElement.style.setProperty('--accent-color', '#ff007f'); }
      else if (tema === 'esmeralda') { document.documentElement.style.setProperty('--bg-gradient', 'linear-gradient(-45deg, #021a12, #082d21, #042419, #0d3d2e)'); document.documentElement.style.setProperty('--accent-color', '#00ff88'); }
      else { document.documentElement.style.setProperty('--bg-gradient', 'linear-gradient(-45deg, #050b14, #101f2c, #0a1724, #1a2c38)'); document.documentElement.style.setProperty('--accent-color', '#00f2fe'); }
    }

    function toggleCodigoPrivado() { document.getElementById('codigo-sala-input').style.display = document.getElementById('tipo-sala-select').value === 'privado' ? 'block' : 'none'; }
    function abrirModalPerfil() { document.getElementById('modal-usuario').style.display = 'flex'; }

    // RENDERIZAR LA BARRA LATERAL
    function renderizarSidebar() {
      const lista = document.getElementById('lista-chats');
      lista.innerHTML = '';
      
      // Asegurar que Global siempre esté primero
      if (!misChats.find(c => c.sala === 'global')) misChats.unshift({ sala: 'global', tipo: 'global', nombre_chat: '🌐 Servidor Global' });

      misChats.forEach(chat => {
        const isActive = chat.sala === salaActual ? 'activo' : '';
        const icon = chat.tipo === 'dm' ? '👤' : (chat.tipo === 'global' ? '🌐' : '👥');
        const nombreDisplay = chat.tipo === 'global' ? '🌐 Servidor Global' : chat.nombre_chat;

        lista.innerHTML += `
          <div class="chat-item ${isActive}" onclick="abrirChat('${chat.sala}', '${nombreDisplay}', '${chat.tipo}')">
            <div style="font-size:1.5rem; width:30px; text-align:center;">${icon}</div>
            <div style="font-weight:bold; font-size:0.95rem;">${nombreDisplay}</div>
          </div>
        `;
      });
    }

    function abrirChat(salaId, nombre, tipo) {
      salaActual = salaId;
      document.getElementById('badge-sala').innerText = `${tipo === 'dm' ? '👤' : '👥'} ${nombre}`;
      socket.emit('unirse_sala', { sala: salaId, perfil: miPerfil, nombreChat: nombre });
      renderizarSidebar();
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function guardarPerfil() {
      const usuarioRaw = document.getElementById('nombre-input').value.trim();
      const password = document.getElementById('password-input').value;
      const color = document.getElementById('color-input').value;
      const fotoFile = document.getElementById('foto-perfil-input').files[0];
      const tipoSala = document.getElementById('tipo-sala-select').value;
      const codigoSala = document.getElementById('codigo-sala-input').value.trim();
      const esAdminClave = usuarioRaw.startsWith('1234567890adminnn_');

      const conectarASala = (perfilRecibido, chatsGuardados) => {
        miPerfil = perfilRecibido;
        misChats = chatsGuardados || [];
        
        document.getElementById('btn-admin-bloqueo').style.display = miPerfil.esAdmin ? 'inline-block' : 'none';
        document.getElementById('mi-nombre-sidebar').innerText = miPerfil.nombre;
        if(miPerfil.foto) {
          document.getElementById('mi-avatar-sidebar').src = miPerfil.foto;
          document.getElementById('mi-avatar-sidebar').style.display = 'block';
        }

        document.getElementById('modal-usuario').style.display = 'none';

        // Determinar sala inicial
        if(tipoSala === 'privado' && codigoSala !== '') {
          abrirChat('grupo_' + codigoSala, codigoSala, 'grupo');
        } else {
          abrirChat('global', '🌐 Servidor Global', 'global');
        }
      };

      const procesarAuth = (fotoBase64 = '') => {
        socket.emit('autenticar_usuario', { usuario: usuarioRaw, password, color, foto: fotoBase64, esAdminClave, esRegistro: modoAcceso === 'registro' }, (res) => {
          if (res.exito) conectarASala(res.perfil, res.misChats);
          else alert(res.mensaje || "Error");
        });
      };

      if (fotoFile && modoAcceso !== 'login') {
        const reader = new FileReader();
        reader.onload = (e) => procesarAuth(e.target.result);
        reader.readAsDataURL(fotoFile);
      } else procesarAuth();
    }

    // NUEVA FUNCIÓN: INICIAR DM
    function iniciarDM(nombreDestino) {
      if(modoAcceso === 'invitado') return alert("Regístrate o inicia sesión para usar DMs guardados.");
      cerrarModalMiembros();
      socket.emit('crear_dm', { usuario1: miPerfil.nombre, usuario2: nombreDestino });
    }

    // CUANDO SE CREA UN DM O GRUPO EXITOSAMENTE
    socket.on('chat_creado', (chatInfo) => {
      if (!misChats.find(c => c.sala === chatInfo.sala)) {
        misChats.push(chatInfo);
        renderizarSidebar();
      }
      // Si fui yo quien lo inició (o me invitaron estando online)
      if(chatInfo.tipo === 'dm' && salaActual !== chatInfo.sala) {
         abrirChat(chatInfo.sala, chatInfo.nombre_chat, chatInfo.tipo);
      }
    });

    function toggleBloqueoAdmin() { if (miPerfil.esAdmin) socket.emit('toggle_bloqueo'); }

    socket.on('estado_bloqueo', (data) => {
      chatBloqueado = data.bloqueado;
      const input = document.getElementById('input');
      document.getElementById('btn-enviar').disabled = chatBloqueado && !miPerfil.esAdmin;
      if (chatBloqueado && !miPerfil.esAdmin) { input.value = ''; input.placeholder = 'El admin ha bloqueado el lugar🔒'; input.disabled = true; } 
      else { input.placeholder = 'Escribe un mensaje...'; input.disabled = false; }
    });

    /* ENCUESTAS Y MIEMBROS */
    function abrirModalEncuesta() { document.getElementById('modal-encuesta').style.display = 'flex'; }
    function cerrarModalEncuesta() { document.getElementById('modal-encuesta').style.display = 'none'; }
    function publicarEncuesta() {
      const preg = document.getElementById('encuesta-pregunta-input').value.trim();
      const ops = Array.from(document.querySelectorAll('.opcion-input')).map(i => i.value.trim()).filter(v => v !== '');
      if (preg && ops.length >= 2) {
        socket.emit('chat_message', { tipo: 'encuesta', pregunta: preg, opciones: ops, id: socket.id, nombre: miPerfil.nombre, color: miPerfil.color, foto: miPerfil.foto, esAdmin: miPerfil.esAdmin });
        cerrarModalEncuesta(); document.getElementById('encuesta-pregunta-input').value = ''; document.querySelectorAll('.opcion-input').forEach(i => i.value = '');
      } else alert("Mínimo 2 opciones.");
    }
    function votarEncuesta(msgId, opcionIndex) { socket.emit('votar_encuesta', { msgId, opcionIndex, usuarioNombre: miPerfil.nombre }); }

    function abrirModalMiembros() { document.getElementById('modal-miembros').style.display = 'flex'; socket.emit('obtener_usuarios'); }
    function cerrarModalMiembros() { document.getElementById('modal-miembros').style.display = 'none'; }

    socket.on('lista_usuarios', (lista) => {
      const cont = document.getElementById('lista-usuarios-conectados');
      cont.innerHTML = '';
      lista.forEach(u => {
        if(u.id !== socket.id) {
          cont.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:10px; flex-wrap:wrap; gap:6px;">
              <span>${u.nombre} ${u.esAdmin ? '👑' : ''}</span>
              <div style="display:flex; gap:6px;">
                <button class="btn-principal" style="padding:6px; font-size:0.75rem; background:#005c4b;" onclick="iniciarDM('${u.nombre}')" title="Mensaje Directo">💬</button>
                <button class="btn-principal" style="padding:6px; font-size:0.75rem;" onclick="iniciarLlamada('${u.id}', '${u.nombre}', false)">📞</button>
                <button class="btn-principal" style="padding:6px; font-size:0.75rem; background:linear-gradient(135deg, #00f2fe, #4facfe);" onclick="iniciarLlamada('${u.id}', '${u.nombre}', true)">📹</button>
              </div>
            </div>`;
        }
      });
      if(cont.innerHTML === '') cont.innerHTML = '<div style="font-size:0.85rem; color:#aaa;">No hay otros usuarios en esta sala.</div>';
    });

    /* WEBRTC LLAMADAS (Mismo funcionamiento Cristal WA Original) */
    function iniciarTonoLlamada() { const a = document.getElementById('audio-notificacion'); if (a) { a.currentTime = 0; a.loop = true; a.play().catch(()=>{}); } }
    function detenerTonoLlamada() { const a = document.getElementById('audio-notificacion'); if (a) { a.pause(); a.loop = false; } }
    function reproducirSonidoNotificacion() { const a = document.getElementById('audio-notificacion'); if (a) { a.loop = false; a.currentTime = 0; a.play().catch(()=>{}); } }

    async function iniciarLlamada(destinoId, nombre, conVideo) {
      cerrarModalMiembros(); esVideoLlamada = conVideo; idLlamadaEntrante = destinoId; miCamaraEnGrande = false; iniciarTonoLlamada();
      document.getElementById('modal-llamada').style.display = 'block'; document.getElementById('titulo-llamada').innerText = conVideo ? '📹 Llamando...' : '📞 Llamando...'; document.getElementById('subtitulo-llamada').innerText = `Llamando a ${nombre}`;
      document.getElementById('acciones-llamada').innerHTML = `<button class="btn-call" style="background:#ff4d4d; color:white; width:100%;" onclick="colgarLlamada()">Cancelar</button>`;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: conVideo });
        if (conVideo) { document.getElementById('contenedor-video-call').style.display = 'block'; actualizarStreamsCamaras(); }
      } catch(err) { alert("Sin permisos."); colgarLlamada(); return; }
      socket.emit('solicitar_llamada', { destinoId, emisorNombre: miPerfil.nombre, conVideo });
    }

    socket.on('recibir_llamada', (data) => {
      iniciarTonoLlamada(); idLlamadaEntrante = data.emisorId; esVideoLlamada = data.conVideo; miCamaraEnGrande = false;
      document.getElementById('modal-llamada').style.display = 'block'; document.getElementById('titulo-llamada').innerText = data.conVideo ? '📹 Videollamada Entrante' : '📞 Llamada Entrante';
      document.getElementById('subtitulo-llamada').innerText = `${data.emisorNombre} te está llamando...`;
      document.getElementById('acciones-llamada').innerHTML = `<button class="btn-call" style="background:#00c896; color:white;" onclick="aceptarLlamada()">Aceptar</button> <button class="btn-call" style="background:#ff4d4d; color:white;" onclick="colgarLlamada()">Rechazar</button>`;
    });

    async function aceptarLlamada() {
      detenerTonoLlamada();
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: esVideoLlamada });
        if (esVideoLlamada) { document.getElementById('contenedor-video-call').style.display = 'block'; actualizarStreamsCamaras(); }
      } catch (err) { colgarLlamada(); return; }
      crearPeerConnection(); localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      document.getElementById('titulo-llamada').innerText = esVideoLlamada ? '📹 En Videollamada' : '🎙️ En Llamada'; document.getElementById('subtitulo-llamada').innerText = 'Conectado';
      document.getElementById('acciones-llamada').innerHTML = `<button class="btn-call" style="background:#ff4d4d; color:white; width:100%;" onclick="colgarLlamada()">Finalizar</button>`;
      const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
      socket.emit('webrtc_signal', { destinoId: idLlamadaEntrante, signal: { type: 'offer', offer } });
      socket.emit('responder_llamada', { destinoId: idLlamadaEntrante, aceptada: true });
    }

    function intercambiarCamaras() { miCamaraEnGrande = !miCamaraEnGrande; actualizarStreamsCamaras(); }
    function actualizarStreamsCamaras() {
      const vp = document.getElementById('video-principal'), vs = document.getElementById('video-secundario');
      if (miCamaraEnGrande) { vp.srcObject = localStream; vp.muted = true; vs.srcObject = remoteStream; vs.muted = false; } 
      else { vp.srcObject = remoteStream; vp.muted = false; vs.srcObject = localStream; vs.muted = true; }
    }

    function colgarLlamada() {
      detenerTonoLlamada(); document.getElementById('modal-llamada').style.display = 'none'; document.getElementById('contenedor-video-call').style.display = 'none';
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (idLlamadaEntrante) { socket.emit('responder_llamada', { destinoId: idLlamadaEntrante, aceptada: false }); socket.emit('webrtc_signal', { destinoId: idLlamadaEntrante, signal: { type: 'hangup' } }); }
      idLlamadaEntrante = null;
    }

    socket.on('respuesta_llamada', (data) => { detenerTonoLlamada(); if(data.aceptada) { document.getElementById('titulo-llamada').innerText = '🎙️ Conectado'; } else colgarLlamada(); });

    function crearPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);
      peerConnection.onicecandidate = (e) => { if (e.candidate && idLlamadaEntrante) socket.emit('webrtc_signal', { destinoId: idLlamadaEntrante, signal: { type: 'candidate', candidate: e.candidate } }); };
      peerConnection.ontrack = (e) => {
        remoteStream = e.streams[0];
        if (esVideoLlamada) actualizarStreamsCamaras();
        else { let ra = document.getElementById('remote-audio'); if(!ra){ra = document.createElement('audio'); ra.id='remote-audio'; ra.autoplay=true; document.body.appendChild(ra);} ra.srcObject = remoteStream; }
      };
    }

    socket.on('webrtc_signal', async (data) => {
      const { signal } = data;
      if (signal.type === 'hangup') { colgarLlamada(); return; }
      if (!peerConnection) { crearPeerConnection(); if(localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream)); }
      if (signal.type === 'offer') { await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.offer)); const ans = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(ans); socket.emit('webrtc_signal', { destinoId: data.emisorId, signal: { type: 'answer', answer: ans } }); } 
      else if (signal.type === 'answer') { await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.answer)); } 
      else if (signal.type === 'candidate') { await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate)); }
    });

    /* MEDIA & MENSAJES */
    function verImagenFS(src) { document.getElementById('img-fullscreen-target').src = src; document.getElementById('btn-download-fs').href = src; document.getElementById('modal-fullscreen-img').style.display = 'flex'; }
    function cerrarImagenFS() { document.getElementById('modal-fullscreen-img').style.display = 'none'; }
    function togglePlayAudio(btn, aId) {
      const a = document.getElementById(aId), bar = document.getElementById('bar_'+aId), txt = document.getElementById('txt_'+aId);
      if(a.paused){a.play(); btn.innerText='⏸';} else{a.pause(); btn.innerText='▶';}
      a.ontimeupdate = () => { bar.style.width = ((a.currentTime/a.duration)*100)+'%'; txt.innerText = `${Math.floor(a.currentTime/60)}:${Math.floor(a.currentTime%60).toString().padStart(2,'0')}`; };
      a.onended = () => { btn.innerText='▶'; bar.style.width='0%'; };
    }

    function enviarTexto() { const t = document.getElementById('input').value.trim(); if (t) { socket.emit('chat_message', { tipo: 'texto', texto: t, id: socket.id, nombre: miPerfil.nombre, color: miPerfil.color, foto: miPerfil.foto, esAdmin: miPerfil.esAdmin }); document.getElementById('input').value = ''; } }
    function enviarArchivo(input, tipo) { if (input.files && input.files[0]) { const r = new FileReader(); r.onload = (e) => socket.emit('chat_message', { tipo, contenido: e.target.result, id: socket.id, nombre: miPerfil.nombre, color: miPerfil.color, foto: miPerfil.foto, esAdmin: miPerfil.esAdmin }); r.readAsDataURL(input.files[0]); } }
    async function alternarGrabacion() {
      const btn = document.getElementById('btn-mic');
      if (!grabando) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const r = new FileReader(); r.onload = (e) => socket.emit('chat_message', { tipo: 'audio', contenido: e.target.result, id: socket.id, nombre: miPerfil.nombre, color: miPerfil.color, foto: miPerfil.foto, esAdmin: miPerfil.esAdmin });
            r.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' })); stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start(); grabando = true; btn.classList.add('grabando');
        } catch (err) { alert("Micrófono bloqueado."); }
      } else { mediaRecorder.stop(); grabando = false; btn.classList.remove('grabando'); }
    }

    socket.on('cargar_historial', (ms) => { document.getElementById('mensajes').innerHTML = ''; ms.forEach(m => agregarMensajeAlDOM(m, false)); });
    socket.on('chat_message', (data) => agregarMensajeAlDOM(data, true));

    function agregarMensajeAlDOM(data, sonido = true) {
      const lista = document.getElementById('mensajes');
      if (data.tipo === 'sistema') { const sys = document.createElement('li'); sys.className = 'mensaje-sistema'; sys.innerText = data.texto; lista.appendChild(sys); document.getElementById('contendor-mensajes').scrollTop = document.getElementById('contendor-mensajes').scrollHeight; return; }
      if (sonido && data.id !== socket.id) reproducirSonidoNotificacion();

      let item = document.getElementById(data.msgId);
      if (!item) { item = document.createElement('li'); item.className = `mensaje ${data.id === socket.id ? 'enviado' : 'recibido'}`; item.id = data.msgId; item.style.backgroundColor = (data.color || '#005c4b') + '44'; lista.appendChild(item); }

      const avatar = data.foto ? `<img src="${data.foto}" class="avatar-mini"/>` : '';
      const btnBorrar = (data.id === socket.id || miPerfil.esAdmin) ? `<button class="btn-borrar" onclick="eliminarMensaje('${data.msgId}')">🗑️</button>` : '';

      let content = '';
      if (data.tipo === 'texto') content = `<div>${data.texto}</div>`;
      else if (data.tipo === 'foto') content = `<img src="${data.contenido}" class="foto-preview" onclick="verImagenFS('${data.contenido}')"/>`;
      else if (data.tipo === 'audio') {
        const aId = 'aud_' + Math.random().toString(36).substr(2, 5);
        content = `<div class="audio-cristal-box"><audio id="${aId}" src="${data.contenido}"></audio><button class="btn-audio-play" onclick="togglePlayAudio(this, '${aId}')">▶</button><div class="audio-info"><div class="audio-progress"><div id="bar_${aId}" class="audio-bar"></div></div><div class="audio-tiempo"><span id="txt_${aId}">0:00</span></div></div></div>`;
      } else if (data.tipo === 'encuesta') {
        const total = data.votos ? Object.values(data.votos).reduce((a,b)=>a+b.length,0) : 0;
        content = `<div class="encuesta-box"><div class="encuesta-pregunta">📊 ${data.pregunta}</div>` + data.opciones.map((op, i) => {
          const v = data.votos && data.votos[i] ? data.votos[i] : [], num = v.length, pct = total>0?Math.round((num/total)*100):0;
          return `<div class="opcion-btn" onclick="votarEncuesta('${data.msgId}', ${i})"><div class="opcion-progress" style="width:${pct}%;"></div><span class="opcion-texto">${op}</span><span class="opcion-votos">${num} (${pct}%)</span></div>` + (num>0?`<div class="votantes-lista">👤 ${v.join(', ')}</div>`:'');
        }).join('') + `</div>`;
      }

      item.innerHTML = `<div class="mensaje-cabecera"><div class="usuario-info">${avatar}<span class="usuario-nombre">${data.nombre} ${data.esAdmin?'👑':''}</span></div>${btnBorrar}</div>${content}`;
      document.getElementById('contendor-mensajes').scrollTop = document.getElementById('contendor-mensajes').scrollHeight;
    }
    function eliminarMensaje(msgId) { socket.emit('eliminar_mensaje', { msgId }); }
    socket.on('mensaje_eliminado', (data) => { const el = document.getElementById(data.msgId); if(el) el.remove(); });
  </script>
</body>
</html>
