<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Cristal WA Ultimate</title>
  
  <style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    /* Fondo oscuro con degradado dinámico para contrastar el cristal */
    background: linear-gradient(-45deg, #050b14, #101f2c, #0a1724, #1a2c38);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex; flex-direction: column; height: 100vh; color: #e9edef;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  header {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }

  header h2 { margin: 0; font-size: 1.1rem; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

  /* MODALES CRISTALINO REAL */
  .modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
    display: flex; justify-content: center; align-items: center; z-index: 100;
  }

  .modal-contenido {
    /* Degradado diagonal simulando reflejo de luz en vidrio */
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 100%);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.5); /* Borde superior brillante */
    border-left: 1px solid rgba(255, 255, 255, 0.5);
    padding: 22px; border-radius: 24px; width: 85%; max-width: 340px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.1);
  }

  .modal-contenido h3 { margin: 0; text-align: center; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }

  .modal-input {
    padding: 10px; border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.25); color: #e9edef; font-size: 0.9rem; outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .btn-principal {
    background: linear-gradient(135deg, rgba(0, 168, 132, 0.8) 0%, rgba(0, 200, 150, 0.6) 100%);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: center;
    box-shadow: 0 4px 15px rgba(0, 168, 132, 0.3);
  }

  .btn-secundario {
    background: rgba(255,255,255,0.08); color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; text-align: center;
  }

  /* ÁREA DE MENSAJES */
  #contendor-mensajes { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #mensajes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }

  /* BURBUJAS DE CRISTAL HIPER-REALISTA */
  .mensaje {
    max-width: 75%; padding: 12px 16px; font-size: 0.95rem; word-wrap: break-word;
    
    /* El truco del cristal: Blur fuerte + Saturación + Reflejo en degradado */
    backdrop-filter: blur(20px) saturate(190%);
    -webkit-backdrop-filter: blur(20px) saturate(190%);
    
    /* Bordes bi-color para dar luz 3D */
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    border-left: 1px solid rgba(255, 255, 255, 0.45);
    
    /* Sombras exterior (relieve) e interior (profundidad de vidrio) */
    box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45), 
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
  }

  .mensaje-cabecera { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .avatar-mini { 
    width: 26px; height: 26px; border-radius: 50%; object-fit: cover; 
    border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .usuario-nombre { font-size: 0.75rem; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

  .mensaje.enviado { align-self: flex-end; border-radius: 20px 20px 4px 20px; }
  .mensaje.recibido { align-self: flex-start; border-radius: 20px 20px 20px 4px; }

  /* MULTIMEDIA */
  .mensaje img.foto-preview { 
    max-width: 250px; max-height: 250px; object-fit: cover;
    border-radius: 14px; margin-top: 5px; display: block; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .btn-descargar {
    display: inline-block; margin-top: 6px; font-size: 0.75rem;
    color: #00f2fe; text-decoration: none; cursor: pointer; text-shadow: 0 0 5px rgba(0,242,254,0.4);
  }

  /* REPRODUCTOR DE AUDIO DE CRISTAL */
  .audio-custom {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 12px; border-radius: 20px; margin-top: 5px; min-width: 200px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
  }
  .btn-play { 
    background: rgba(0, 168, 132, 0.8); border: 1px solid rgba(255,255,255,0.3);
    width: 34px; height: 34px; border-radius: 50%; color: white; cursor: pointer; font-size: 0.85rem; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ENCUESTAS DE CRISTAL */
  .encuesta-box { 
    background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 12px; border-radius: 14px; margin-top: 5px; min-width: 220px; 
  }
  .encuesta-opcion {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 12px; margin: 6px 0; border-radius: 10px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    backdrop-filter: blur(5px);
  }
  .encuesta-opcion:hover { background: rgba(255,255,255,0.2); }
  .votos-conteo { font-size: 0.8rem; font-weight: bold; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 8px; }

  /* BARRA DE ENTRADA */
  #barra-entrada {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    padding: 12px; display: flex; align-items: center; gap: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 -8px 32px 0 rgba(0, 0, 0, 0.2);
  }

  .btn-icono { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #aebac1; }
  #input {
    flex: 1; padding: 10px 16px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0, 0, 0, 0.3); color: #e9edef; outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }

  /* EFECTO PARPADEO GRABANDO AUDIO */
  .grabando-anim {
    border-radius: 50%;
    animation: pulsoAzul 1.2s infinite;
  }
  @keyframes pulsoAzul {
    0% { box-shadow: 0 0 0 0px rgba(0, 242, 254, 0.8); }
    70% { box-shadow: 0 0 0 12px rgba(0, 242, 254, 0); }
    100% { box-shadow: 0 0 0 0px rgba(0, 242, 254, 0); }
  }

  /* MODAL PANTALLA COMPLETA */
  #lightbox {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
    justify-content: center; align-items: center;
    flex-direction: column; z-index: 200;
  }
  #lightbox img { max-width: 90%; max-height: 80%; border-radius: 14px; border: 1px solid rgba(255,255,255,0.3); }
</style>
</head>
<body>

  <!-- MODAL PERFIL -->
  <div id="modal-usuario" class="modal">
    <div class="modal-contenido">
      <h3>Configurar Perfil</h3>
      <input type="text" id="nombre-input" class="modal-input" placeholder="Tu Nombre..." maxlength="15" />
      <label style="font-size: 0.8rem;">Color del Cristal:</label>
      <input type="color" id="color-input" style="width:100%; height:35px; border:none; cursor:pointer;" value="#005c4b" />
      
      <label style="font-size: 0.8rem;">Foto de Perfil (Opcional):</label>
      <input type="file" id="foto-perfil-input" accept="image/*" class="modal-input" />

      <button class="btn-principal" onclick="guardarPerfil()">Guardar y Entrar</button>
      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); width:100%; margin:4px 0;">
      
      <button class="btn-secundario" onclick="exportarPerfil()">💾 Exportar Configuración</button>
      <label class="btn-secundario" style="cursor:pointer;">📂 Cargar Configuración
        <input type="file" id="importar-config" accept=".json" style="display:none;" onchange="importarPerfil(this)" />
      </label>
    </div>
  </div>

  <!-- MODAL CREAR ENCUESTA -->
  <div id="modal-encuesta" class="modal" style="display:none;">
    <div class="modal-contenido">
      <h3>Crear Encuesta</h3>
      <input type="text" id="encuesta-pregunta" class="modal-input" placeholder="Pregunta..." />
      <input type="text" id="encuesta-op1" class="modal-input" placeholder="Opción 1" />
      <input type="text" id="encuesta-op2" class="modal-input" placeholder="Opción 2" />
      <button class="btn-principal" onclick="enviarEncuesta()">Publicar Encuesta</button>
      <button class="btn-secundario" style="background:#cc0000;" onclick="cerrarModalEncuesta()">Cancelar</button>
    </div>
  </div>

  <!-- LIGHTBOX PANTALLA COMPLETA -->
  <div id="lightbox" onclick="cerrarLightbox()">
    <img id="img-lightbox" src="" />
    <a id="btn-descargar-lightbox" class="btn-principal" style="margin-top:15px; text-decoration:none;" download="imagen.png" onclick="event.stopPropagation()">Descargar Imagen</a>
  </div>

  <header>
    <h2>Chat Cristal WA</h2>
    <div>
      <button class="btn-icono" onclick="abrirModalPerfil()">👤</button>
      <button class="btn-icono" onclick="abrirModalEncuesta()">📊</button>
    </div>
  </header>

  <div id="contendor-mensajes">
    <ul id="mensajes"></ul>
  </div>

  <div id="barra-entrada">
    <!-- Enviar fotos -->
    <label class="btn-icono" title="Enviar Foto">📷
      <input type="file" accept="image/*" style="display:none;" onchange="enviarArchivo(this, 'foto')" />
    </label>
    
    <!-- Enviar archivos/audios reales -->
    <label class="btn-icono" title="Enviar Archivo/Audio Real">📁
      <input type="file" style="display:none;" onchange="enviarArchivo(this, 'archivo')" />
    </label>

    <!-- Grabador de voz -->
    <button id="btn-audio" class="btn-icono" title="Grabar Nota de Voz" onclick="gestionarGrabacion()">🎙️</button>

    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
    <button class="btn-principal" onclick="enviarTexto()">Enviar</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });

    const listaMensajes = document.getElementById('mensajes');
    const inputMensaje = document.getElementById('input');
    const contenedor = document.getElementById('contendor-mensajes');

    let usuarioActual = { nombre: 'Anónimo', color: '#005c4b', foto: '' };
    let mediaRecorder = null;
    let audioChunks = [];
    let grabando = false;

    // --- SONIDO DE NOTIFICACIÓN ---
    function sonarNotificacion() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); 
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    // --- MANEJO DE PERFIL ---
    function abrirModalPerfil() { document.getElementById('modal-usuario').style.display = 'flex'; }

    function guardarPerfil() {
      const nom = document.getElementById('nombre-input').value.trim();
      const fotoFile = document.getElementById('foto-perfil-input').files[0];
      
      if (nom) usuarioActual.nombre = nom;
      usuarioActual.color = document.getElementById('color-input').value;

      if (fotoFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          usuarioActual.foto = e.target.result;
          document.getElementById('modal-usuario').style.display = 'none';
        };
        reader.readAsDataURL(fotoFile);
      } else {
        document.getElementById('modal-usuario').style.display = 'none';
      }
    }

    function exportarPerfil() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(usuarioActual));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `perfil_${usuarioActual.nombre}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarPerfil(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const config = JSON.parse(e.target.result);
          usuarioActual = config;
          document.getElementById('nombre-input').value = config.nombre || '';
          document.getElementById('color-input').value = config.color || '#005c4b';
          alert('¡Perfil cargado con éxito!');
          document.getElementById('modal-usuario').style.display = 'none';
        };
        reader.readAsText(file);
      }
    }

    function formatearTexto(texto) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return texto.replace(urlRegex, (url) => `<a href="${url}" target="_blank" style="color:#53bdeb;">${url}</a>`);
    }

    // --- ENVIAR TEXTO ---
    function enviarTexto() {
      const texto = inputMensaje.value.trim();
      if (texto) {
        socket.emit('chat_message', { 
          tipo: 'texto', texto: texto, id: socket.id,
          nombre: usuarioActual.nombre, color: usuarioActual.color, foto: usuarioActual.foto
        });
        inputMensaje.value = '';
      }
    }
    inputMensaje.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarTexto(); });

    // --- ENVIAR FOTOS Y ARCHIVOS REALES ---
    function enviarArchivo(input, tipoDetectado) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          let tipoFinal = tipoDetectado;
          if (file.type.startsWith('image/')) tipoFinal = 'foto';
          else if (file.type.startsWith('audio/')) tipoFinal = 'audio';
          
          socket.emit('chat_message', {
            tipo: tipoFinal,
            contenido: e.target.result,
            nombreArchivo: file.name,
            id: socket.id,
            nombre: usuarioActual.nombre, color: usuarioActual.color, foto: usuarioActual.foto
          });
        };
        reader.readAsDataURL(file);
      }
    }

    // --- GRABACIÓN DE AUDIO (CON EFECTO AZUL) ---
    async function gestionarGrabacion() {
      const btn = document.getElementById('btn-audio');
      if (!grabando) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = function(e) {
              socket.emit('chat_message', {
                tipo: 'audio', contenido: e.target.result, nombreArchivo: 'Nota_Voz.webm',
                id: socket.id, nombre: usuarioActual.nombre, color: usuarioActual.color, foto: usuarioActual.foto
              });
            };
            reader.readAsDataURL(audioBlob);
          };
          mediaRecorder.start();
          grabando = true;
          btn.classList.add('grabando-anim');
        } catch (err) { alert("Sin permiso de micrófono."); }
      } else {
        mediaRecorder.stop();
        grabando = false;
        btn.classList.remove('grabando-anim');
      }
    }

    // --- ENCUESTAS ---
    function abrirModalEncuesta() { document.getElementById('modal-encuesta').style.display = 'flex'; }
    function cerrarModalEncuesta() { document.getElementById('modal-encuesta').style.display = 'none'; }

    function enviarEncuesta() {
      const preg = document.getElementById('encuesta-pregunta').value.trim();
      const op1 = document.getElementById('encuesta-op1').value.trim();
      const op2 = document.getElementById('encuesta-op2').value.trim();

      if (preg && op1 && op2) {
        socket.emit('chat_message', {
          tipo: 'encuesta', encuestaId: 'enc_' + Date.now(),
          pregunta: preg, opciones: [ { texto: op1, votos: 0 }, { texto: op2, votos: 0 } ],
          id: socket.id, nombre: usuarioActual.nombre, color: usuarioActual.color, foto: usuarioActual.foto
        });
        cerrarModalEncuesta();
      }
    }

    function emitirVoto(encuestaId, opcionIndex) {
      socket.emit('votar_encuesta', { encuestaId, opcionIndex });
    }

    socket.on('actualizar_voto', (data) => {
      const contenedorEncuesta = document.getElementById(data.encuestaId);
      if (contenedorEncuesta) {
        const spanVotos = contenedorEncuesta.querySelector(`.voto-op-${data.opcionIndex}`);
        if (spanVotos) {
          let votosAnteriores = parseInt(spanVotos.getAttribute('data-votos')) || 0;
          let nuevosVotos = votosAnteriores + 1;
          spanVotos.setAttribute('data-votos', nuevosVotos);
          spanVotos.innerText = `${nuevosVotos} votos`;
        }
      }
    });

    // --- PANTALLA COMPLETA IMAGEN ---
    function verImagenCompleta(url) {
      document.getElementById('img-lightbox').src = url;
      document.getElementById('btn-descargar-lightbox').href = url;
      document.getElementById('lightbox').style.display = 'flex';
    }
    function cerrarLightbox() { document.getElementById('lightbox').style.display = 'none'; }

    // --- REPRODUCTOR DE AUDIO PERSONALIZADO ---
    function reproducirAudio(btn, url) {
      let audio = btn.audioObj;
      if (!audio) {
        audio = new Audio(url);
        btn.audioObj = audio;
        audio.onended = () => btn.innerText = "▶";
      }
      if (audio.paused) {
        audio.play(); btn.innerText = "⏸";
      } else {
        audio.pause(); btn.innerText = "▶";
      }
    }

    // --- MOSTRAR MENSAJES EN PANTALLA ---
    socket.on('chat_message', (data) => {
      const item = document.createElement('li');
      item.classList.add('mensaje');
      
      // Aplicar color en formato Glassmorphism
      const hexColor = data.color || '#005c4b';
      item.style.backgroundColor = hexColor + '55'; // Opacidad de cristal

      if (data.id === socket.id) {
        item.classList.add('enviado');
      } else {
        item.classList.add('recibido');
        sonarNotificacion();
      }

      // Avatar opcional
      const avatarHtml = data.foto ? `<img src="${data.foto}" class="avatar-mini"/>` : '';

      let html = `
        <div class="mensaje-cabecera">
          ${avatarHtml}
          <span class="usuario-nombre">${data.nombre || 'Anónimo'}</span>
        </div>`;

      if (data.tipo === 'texto') {
        html += `<div>${formatearTexto(data.texto)}</div>`;
      } 
      else if (data.tipo === 'foto') {
        html += `
          <img src="${data.contenido}" class="foto-preview" onclick="verImagenCompleta('${data.contenido}')"/>
          <a class="btn-descargar" href="${data.contenido}" download="imagen.png">💾 Descargar foto</a>`;
      } 
      else if (data.tipo === 'audio') {
        html += `
          <div class="audio-custom">
            <button class="btn-play" onclick="reproducirAudio(this, '${data.contenido}')">▶</button>
            <span style="font-size:0.8rem;">Mensaje de voz / Audio</span>
          </div>
          <a class="btn-descargar" href="${data.contenido}" download="${data.nombreArchivo || 'audio.mp3'}">💾 Descargar audio</a>`;
      } 
      else if (data.tipo === 'archivo') {
        html += `
          <div style="margin-top:5px;">📁 <strong>${data.nombreArchivo || 'Archivo'}</strong></div>
          <a class="btn-descargar" href="${data.contenido}" download="${data.nombreArchivo || 'archivo'}">💾 Descargar archivo</a>`;
      } 
      else if (data.tipo === 'encuesta') {
        html += `
          <div class="encuesta-box" id="${data.encuestaId}">
            <strong>📊 ${data.pregunta}</strong>
            ${data.opciones.map((op, i) => `
              <div class="encuesta-opcion" onclick="emitirVoto('${data.encuestaId}', ${i})">
                <span>${op.texto}</span>
                <span class="votos-conteo voto-op-${i}" data-votos="0">0 votos</span>
              </div>
            `).join('')}
          </div>`;
      }

      item.innerHTML = html;
      listaMensajes.appendChild(item);
      contenedor.scrollTop = contenedor.scrollHeight;
    });
  </script>
</body>
</html>
