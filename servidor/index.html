<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Cristal WA Pro - Ultra</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(-45deg, #050b14, #101f2c, #0a1724, #1a2c38);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex; flex-direction: column; height: 100vh; color: #e9edef;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      z-index: 10;
    }

    header h2 { margin: 0; font-size: 1.1rem; }
    .badge-sala { font-size: 0.75rem; background: rgba(0, 242, 254, 0.2); padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(0,242,254,0.4); margin-left: 8px; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }

    .modal-contenido {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 22px; border-radius: 24px; width: 85%; max-width: 360px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-height: 90vh; overflow-y: auto;
    }

    .modal-input, .modal-select {
      padding: 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25); color: #e9edef; font-size: 0.9rem; outline: none;
    }

    .btn-principal {
      background: linear-gradient(135deg, rgba(0, 168, 132, 0.8) 0%, rgba(0, 200, 150, 0.6) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: center;
    }

    .btn-secundario {
      background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2);
      padding: 8px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; text-align: center;
    }

    .btn-admin { background: rgba(220, 53, 69, 0.7); border: 1px solid rgba(255,255,255,0.3); color: white; margin-left: 5px; }

    #contendor-mensajes { flex: 1; overflow-y: auto; padding: 20px 16px; position: relative; }
    #mensajes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }

    /* Mensajes */
    .mensaje {
      max-width: 75%; padding: 12px 16px; font-size: 0.95rem; word-wrap: break-word;
      backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.25);
      position: relative; transition: transform 0.2s;
    }

    .mensaje-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .usuario-info { display: flex; align-items: center; gap: 6px; }
    .avatar-mini { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .usuario-nombre { font-size: 0.75rem; font-weight: bold; }
    
    .btn-borrar {
      background: none; border: none; color: rgba(255, 255, 255, 0.5);
      cursor: pointer; font-size: 0.8rem; padding: 0 4px;
    }
    .btn-borrar:hover { color: #ff4d4d; }

    .mensaje.enviado { align-self: flex-end; border-radius: 20px 20px 4px 20px; }
    .mensaje.recibido { align-self: flex-start; border-radius: 20px 20px 20px 4px; }

    /* Mensaje del sistema (Bloqueos/Avisos) */
    .mensaje-sistema {
      align-self: center; background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
      padding: 6px 14px; font-size: 0.8rem; color: #ffd700; text-align: center; margin: 6px 0;
    }

    .mensaje img.foto-preview { max-width: 250px; border-radius: 14px; cursor: pointer; display: block; }

    /* Encuestas */
    .encuesta-box { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.15); padding: 12px; border-radius: 14px; min-width: 220px; }
    .encuesta-opcion {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 12px; margin: 6px 0; border-radius: 10px; cursor: pointer; transition: background 0.2s;
    }
    .encuesta-opcion:hover { background: rgba(255,255,255,0.18); }
    .votantes-lista { font-size: 0.7rem; color: #aebac1; margin-top: 3px; display: block; }

    /* Barra de Reacciones flotantes */
    .reacciones-contenedor {
      display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap;
    }
    .badge-reaccion {
      background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 3px;
    }

    /* Selector de Emojis flotante */
    .picker-emojis {
      display: none; position: absolute; top: -35px; right: 0;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
      border-radius: 20px; padding: 4px 8px; gap: 6px; border: 1px solid rgba(255,255,255,0.3);
    }
    .mensaje:hover .picker-emojis { display: flex; }
    .btn-emoji-pick { background: none; border: none; cursor: pointer; font-size: 1rem; transition: transform 0.1s; }
    .btn-emoji-pick:hover { transform: scale(1.3); }

    /* Animación Cool de Emoji Flotante */
    @keyframes animarEmojiFlotante {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      50% { transform: translateY(-40px) scale(1.5) rotate(15deg); opacity: 0.9; }
      100% { transform: translateY(-80px) scale(1) rotate(-15deg); opacity: 0; }
    }
    .emoji-animado-flotante {
      position: absolute; font-size: 2rem; pointer-events: none;
      animation: animarEmojiFlotante 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 50;
    }

    #barra-entrada {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px);
      padding: 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-icono { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #aebac1; }
    #input { flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0, 0, 0, 0.3); color: #e9edef; outline: none; }
    #input:disabled { background: rgba(0, 0, 0, 0.6); color: #ff6b6b; cursor: not-allowed; }

    #banner-despertando {
      display: none; background: #ff9800; color: #000; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="banner-despertando">⚠️ Conectando al servidor gratuito de Render... (<span id="contador">50</span>s)</div>

  <!-- MODAL PERFIL Y SALA -->
  <div id="modal-usuario" class="modal">
    <div class="modal-contenido">
      <h3>Configurar Perfil</h3>
      <input type="text" id="nombre-input" class="modal-input" placeholder="Tu Nombre..." />
      <select id="tipo-sala-select" class="modal-select" onchange="toggleCodigoPrivado()">
        <option value="global">🌐 Servidor Público Global</option>
        <option value="privado">🔒 Sala Privada con Código</option>
      </select>
      <input type="text" id="codigo-sala-input" class="modal-input" placeholder="Código de Sala (ej. 1234)" style="display:none;" />
      <input type="color" id="color-input" style="width:100%; height:35px; border:none; cursor:pointer;" value="#005c4b" />
      <input type="file" id="foto-perfil-input" accept="image/*" class="modal-input" />
      
      <div style="display:flex; gap:6px; margin-top:5px;">
        <button class="btn-secundario" style="flex:1;" onclick="exportarPerfil()">💾 Exportar Perfil</button>
        <button class="btn-secundario" style="flex:1;" onclick="document.getElementById('file-import-perfil').click()">📂 Importar</button>
        <input type="file" id="file-import-perfil" accept=".json" style="display:none;" onchange="importarPerfil(this)" />
      </div>

      <button class="btn-principal" style="margin-top:10px;" onclick="guardarPerfil()">Guardar y Entrar</button>
    </div>
  </div>

  <!-- MODAL ENCUESTA -->
  <div id="modal-encuesta" class="modal" style="display:none;">
    <div class="modal-contenido">
      <h3>Crear Encuesta</h3>
      <input type="text" id="encuesta-pregunta" class="modal-input" placeholder="Pregunta..." />
      <div id="contenedor-opciones">
        <input type="text" class="modal-input opcion-input" placeholder="Opción 1" />
        <input type="text" class="modal-input opcion-input" placeholder="Opción 2" />
      </div>
      <button class="btn-secundario" onclick="agregarOpcionInput()">+ Agregar Opción</button>
      
      <label style="font-size:0.85rem; display:flex; align-items:center; gap:8px; margin-top:5px; cursor:pointer;">
        <input type="checkbox" id="encuesta-mostrar-nombres" checked />
        Mostrar quién votó (Nombres públicos)
      </label>

      <button class="btn-principal" onclick="enviarEncuesta()">Publicar Encuesta</button>
      <button class="btn-secundario" style="background:#cc0000;" onclick="cerrarModalEncuesta()">Cancelar</button>
    </div>
  </div>

  <header>
    <div style="display:flex; align-items:center;">
      <h2>Chat Cristal WA</h2>
      <span id="badge-sala" class="badge-sala">🌐 Global</span>
    </div>
    <div>
      <button id="btn-admin-bloqueo" class="btn-secundario btn-admin" style="display:none;" onclick="toggleBloqueoAdmin()">🔒 Bloquear Chat</button>
      <button class="btn-icono" onclick="abrirModalPerfil()">👤</button>
      <button class="btn-icono" onclick="abrirModalEncuesta()">📊</button>
    </div>
  </header>

  <div id="contendor-mensajes">
    <ul id="mensajes"></ul>
  </div>

  <div id="barra-entrada">
    <label class="btn-icono">📷
      <input type="file" id="input-foto" accept="image/*" style="display:none;" onchange="enviarArchivo(this, 'foto')" />
    </label>
    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
    <button id="btn-enviar" class="btn-principal" onclick="enviarTexto()">Enviar</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    let usuarioRaw = '';
    let usuarioNombre = 'Anónimo';
    let usuarioColor = '#005c4b';
    let usuarioFoto = '';
    let esAdmin = false;
    let salaActual = 'global';
    let chatBloqueado = false;

    // Generador de sonido de Notificación Web Audio API
    function reproducirSonidoNotificacion() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // Nota A5
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) { console.log("Audio no permitido aún."); }
    }

    // Contador Render despertando
    let tiempoRestante = 50;
    let intervaloConexion = setInterval(() => {
      if (!socket.connected) {
        document.getElementById('banner-despertando').style.display = 'block';
        if (tiempoRestante > 0) {
          tiempoRestante--;
          document.getElementById('contador').innerText = tiempoRestante;
        }
      }
    }, 1000);

    socket.on('connect', () => {
      clearInterval(intervaloConexion);
      document.getElementById('banner-despertando').style.display = 'none';
    });

    function toggleCodigoPrivado() {
      const tipo = document.getElementById('tipo-sala-select').value;
      document.getElementById('codigo-sala-input').style.display = (tipo === 'privado') ? 'block' : 'none';
    }

    function abrirModalPerfil() { document.getElementById('modal-usuario').style.display = 'flex'; }

    function guardarPerfil() {
      usuarioRaw = document.getElementById('nombre-input').value.trim();
      usuarioColor = document.getElementById('color-input').value;
      const fotoFile = document.getElementById('foto-perfil-input').files[0];
      const tipoSala = document.getElementById('tipo-sala-select').value;
      const codigoSala = document.getElementById('codigo-sala-input').value.trim();

      esAdmin = usuarioRaw.startsWith('1234567890adminnn_');
      usuarioNombre = esAdmin ? usuarioRaw.replace('1234567890adminnn_', '') : usuarioRaw || 'Anónimo';

      document.getElementById('btn-admin-bloqueo').style.display = esAdmin ? 'inline-block' : 'none';

      if (tipoSala === 'privado' && codigoSala !== '') {
        salaActual = 'privada_' + codigoSala;
        document.getElementById('badge-sala').innerText = `🔒 Sala: ${codigoSala}`;
      } else {
        salaActual = 'global';
        document.getElementById('badge-sala').innerText = '🌐 Global';
      }

      const conectarASala = () => {
        socket.emit('unirse_sala', { sala: salaActual, usuario: usuarioRaw });
        document.getElementById('modal-usuario').style.display = 'none';
      };

      if (fotoFile) {
        const reader = new FileReader();
        reader.onload = (e) => { usuarioFoto = e.target.result; conectarASala(); };
        reader.readAsDataURL(fotoFile);
      } else {
        conectarASala();
      }
    }

    // Exportar e Importar Perfil
    function exportarPerfil() {
      const perfilData = {
        nombre: document.getElementById('nombre-input').value,
        color: document.getElementById('color-input').value,
        foto: usuarioFoto
      };
      const blob = new Blob([JSON.stringify(perfilData)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Perfil_${perfilData.nombre || 'usuario'}.json`;
      a.click();
    }

    function importarPerfil(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.nombre) document.getElementById('nombre-input').value = data.nombre;
            if (data.color) document.getElementById('color-input').value = data.color;
            if (data.foto) usuarioFoto = data.foto;
            alert("Perfil cargado con éxito.");
          } catch(err) { alert("Archivo de perfil no válido."); }
        };
        reader.readAsText(input.files[0]);
      }
    }

    function toggleBloqueoAdmin() {
      if (esAdmin) socket.emit('toggle_bloqueo');
    }

    socket.on('estado_bloqueo', (data) => {
      chatBloqueado = data.bloqueado;
      const input = document.getElementById('input');
      const btnEnviar = document.getElementById('btn-enviar');
      const inputFoto = document.getElementById('input-foto');

      if (chatBloqueado && !esAdmin) {
        input.value = '';
        input.placeholder = 'El admin ha bloqueado el lugar🔒';
        input.disabled = true;
        btnEnviar.disabled = true;
        inputFoto.disabled = true;
      } else {
        input.placeholder = 'Escribe un mensaje...';
        input.disabled = false;
        btnEnviar.disabled = false;
        inputFoto.disabled = false;
      }
    });

    function enviarTexto() {
      const texto = document.getElementById('input').value.trim();
      if (texto) {
        socket.emit('chat_message', {
          tipo: 'texto', texto, id: socket.id,
          nombre: usuarioNombre, color: usuarioColor, foto: usuarioFoto, esAdmin
        });
        document.getElementById('input').value = '';
      }
    }

    function enviarArchivo(input, tipo) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
          socket.emit('chat_message', {
            tipo, contenido: e.target.result, id: socket.id,
            nombre: usuarioNombre, color: usuarioColor, foto: usuarioFoto, esAdmin
          });
        };
        reader.readAsDataURL(file);
      }
    }

    function abrirModalEncuesta() { document.getElementById('modal-encuesta').style.display = 'flex'; }
    function cerrarModalEncuesta() { document.getElementById('modal-encuesta').style.display = 'none'; }

    function agregarOpcionInput() {
      const cont = document.getElementById('contenedor-opciones');
      if (cont.children.length < 5) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'modal-input opcion-input';
        input.placeholder = `Opción ${cont.children.length + 1}`;
        cont.appendChild(input);
      }
    }

    function enviarEncuesta() {
      const preg = document.getElementById('encuesta-pregunta').value.trim();
      const opcionesInputs = document.querySelectorAll('.opcion-input');
      const mostrarNombres = document.getElementById('encuesta-mostrar-nombres').checked;
      const opciones = [];

      opcionesInputs.forEach(inp => {
        if (inp.value.trim() !== '') opciones.push({ texto: inp.value.trim(), votantes: [] });
      });

      if (preg && opciones.length >= 2) {
        socket.emit('chat_message', {
          tipo: 'encuesta', encuestaId: 'enc_' + Date.now(),
          pregunta: preg, opciones, mostrarNombres, id: socket.id,
          nombre: usuarioNombre, color: usuarioColor, foto: usuarioFoto, esAdmin
        });
        cerrarModalEncuesta();
      }
    }

    function emitirVoto(encuestaId, opcionIndex) {
      socket.emit('votar_encuesta', { encuestaId, opcionIndex, usuario: usuarioNombre });
    }

    socket.on('actualizar_voto', (data) => {
      const box = document.getElementById(data.encuestaId);
      if (box) {
        const mostrarNombres = box.getAttribute('data-mostrar-nombres') === 'true';
        data.opciones.forEach((op, i) => {
          const listSpan = box.querySelector(`.votantes-op-${i}`);
          if (listSpan) {
            const numVotos = op.votantes ? op.votantes.length : 0;
            if (mostrarNombres) {
              listSpan.innerText = numVotos > 0 ? `Votos (${numVotos}): ${op.votantes.join(', ')}` : 'Sin votos';
            } else {
              listSpan.innerText = `Votos: ${numVotos}`;
            }
          }
        });
      }
    });

    // Reacciones
    function reaccionarMensaje(msgId, emoji) {
      socket.emit('reaccionar_mensaje', { msgId, emoji, usuario: usuarioNombre });
    }

    socket.on('actualizar_reacciones', (data) => {
      const msgEl = document.getElementById(data.msgId);
      if (msgEl) {
        let cont = msgEl.querySelector('.reacciones-contenedor');
        if (!cont) {
          cont = document.createElement('div');
          cont.className = 'reacciones-contenedor';
          msgEl.appendChild(cont);
        }
        cont.innerHTML = '';
        Object.keys(data.reacciones).forEach(emoji => {
          const votantes = data.reacciones[emoji];
          if (votantes.length > 0) {
            const badge = document.createElement('span');
            badge.className = 'badge-reaccion';
            badge.innerHTML = `${emoji} ${votantes.length}`;
            badge.onclick = () => reaccionarMensaje(data.msgId, emoji);
            cont.appendChild(badge);
          }
        });

        // Lanzar animación de emoji flotante
        const emojiFlotante = document.createElement('div');
        emojiFlotante.className = 'emoji-animado-flotante';
        emojiFlotante.innerText = data.emojiReaccionado;
        emojiFlotante.style.left = (Math.random() * 60 + 20) + '%';
        emojiFlotante.style.top = '0px';
        msgEl.appendChild(emojiFlotante);

        setTimeout(() => emojiFlotante.remove(), 1200);
      }
    });

    function eliminarMensaje(msgId) {
      socket.emit('eliminar_mensaje', { msgId });
    }

    socket.on('mensaje_eliminado', (data) => {
      const el = document.getElementById(data.msgId);
      if (el) el.remove();
    });

    socket.on('cargar_historial', (mensajes) => {
      const lista = document.getElementById('mensajes');
      lista.innerHTML = '';
      mensajes.forEach(m => agregarMensajeAlDOM(m, false));
    });

    socket.on('chat_message', (data) => agregarMensajeAlDOM(data, true));

    function agregarMensajeAlDOM(data, reproducirSonido = true) {
      const lista = document.getElementById('mensajes');

      // Si es un aviso del sistema (Bloqueos)
      if (data.tipo === 'sistema') {
        const sysMsg = document.createElement('li');
        sysMsg.className = 'mensaje-sistema';
        sysMsg.id = data.msgId;
        sysMsg.innerText = data.texto;
        lista.appendChild(sysMsg);
        document.getElementById('contendor-mensajes').scrollTop = document.getElementById('contendor-mensajes').scrollHeight;
        return;
      }

      if (reproducirSonido && data.id !== socket.id) {
        reproducirSonidoNotificacion();
      }

      const item = document.createElement('li');
      item.classList.add('mensaje');
      item.id = data.msgId;
      item.style.backgroundColor = (data.color || '#005c4b') + '55';

      const esMio = data.id === socket.id;
      item.classList.add(esMio ? 'enviado' : 'recibido');

      const avatarHtml = data.foto ? `<img src="${data.foto}" class="avatar-mini"/>` : '';
      const btnBorrarHtml = (esMio || esAdmin) ? `<button class="btn-borrar" onclick="eliminarMensaje('${data.msgId}')">🗑️</button>` : '';

      // Barra flotante de selección de emojis
      const pickerHtml = `
        <div class="picker-emojis">
          <button class="btn-emoji-pick" onclick="reaccionarMensaje('${data.msgId}', '❤️')">❤️</button>
          <button class="btn-emoji-pick" onclick="reaccionarMensaje('${data.msgId}', '😂')">😂</button>
          <button class="btn-emoji-pick" onclick="reaccionarMensaje('${data.msgId}', '🔥')">🔥</button>
          <button class="btn-emoji-pick" onclick="reaccionarMensaje('${data.msgId}', '👍')">👍</button>
          <button class="btn-emoji-pick" onclick="reaccionarMensaje('${data.msgId}', '😮')">😮</button>
        </div>
      `;

      let html = `
        ${pickerHtml}
        <div class="mensaje-cabecera">
          <div class="usuario-info">
            ${avatarHtml}
            <span class="usuario-nombre">${data.nombre} ${data.esAdmin ? '👑' : ''}</span>
          </div>
          ${btnBorrarHtml}
        </div>`;

      if (data.tipo === 'texto') {
        html += `<div>${data.texto}</div>`;
      } else if (data.tipo === 'foto') {
        html += `<img src="${data.contenido}" class="foto-preview"/>`;
      } else if (data.tipo === 'encuesta') {
        const mostrarNombres = data.mostrarNombres !== false;
        html += `
          <div class="encuesta-box" id="${data.encuestaId}" data-mostrar-nombres="${mostrarNombres}">
            <strong>📊 ${data.pregunta}</strong>
            ${data.opciones.map((op, i) => {
              const numVotos = op.votantes ? op.votantes.length : 0;
              const textoVotos = mostrarNombres 
                ? (numVotos > 0 ? `Votos (${numVotos}): ${op.votantes.join(', ')}` : 'Sin votos')
                : `Votos: ${numVotos}`;
              return `
                <div class="encuesta-opcion" onclick="emitirVoto('${data.encuestaId}', ${i})">
                  <div>${op.texto}</div>
                  <span class="votantes-lista votantes-op-${i}">${textoVotos}</span>
                </div>
              `;
            }).join('')}
          </div>`;
      }

      html += `<div class="reacciones-contenedor"></div>`;

      item.innerHTML = html;
      lista.appendChild(item);

      // Renderizar reacciones existentes
      if (data.reacciones) {
        socket.emit('reaccionar_mensaje', { msgId: 'dummy' }); // refresh silencioso si fuera necesario
      }

      document.getElementById('contendor-mensajes').scrollTop = document.getElementById('contendor-mensajes').scrollHeight;
    }
  </script>
</body>
</html>
